name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install flask flask-sqlalchemy qrcode pillow reportlab requests PyPDF2
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name="CarpetManager" `
          --add-data "templates;templates" `
          --hidden-import=reportlab `
          --hidden-import=reportlab.pdfgen `
          --hidden-import=reportlab.lib `
          --hidden-import=reportlab.lib.pagesizes `
          --hidden-import=reportlab.lib.units `
          --hidden-import=reportlab.lib.utils `
          --hidden-import=requests `
          --hidden-import=PyPDF2 `
          --hidden-import=pypdf `
          --collect-all=PyPDF2 `
          app.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarpetManager
        path: dist/CarpetManager.exe
    
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/CarpetManager.exe
        generate_release_notes: true