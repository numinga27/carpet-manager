name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: # Добавляем триггер для тегов
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # Добавляем права на создание релиза

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name="CarpetManager" --add-data "templates;templates" app.py
    
    # Шаг 1: Сохраняем .exe как артефакт (как у вас и было)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarpetManager
        path: dist/CarpetManager.exe
    
    # Шаг 2: Создаем релиз и загружаем .exe
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      # Этот шаг выполнится ТОЛЬКО если workflow запущен из-за пуша тега
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/CarpetManager.exe
        generate_release_notes: true # Автоматически генерирует описание релиза из коммитов